
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — Maryanne's Online Shop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --orange: #ff6b00;
      --orange-dark: #e85f00;
      --dark: #03060c;
      --text: #20242c;
      --muted: #8b929e;
      --border: #e9ebef;
      --background: #f6f7f9;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: "Hanken Grotesk", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .topbar {
      height: 76px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      color: var(--dark);
    }

    .brand img {
      width: 43px;
      height: 43px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .brand-name span {
      color: var(--orange);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #555d69;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--orange);
    }

    .page-container {
      width: min(1080px, calc(100% - 40px));
      margin: 34px auto;
    }

    .page-heading {
      margin-bottom: 22px;
    }

    .page-heading h1 {
      margin: 0 0 6px;
      color: var(--dark);
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .page-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .chat-card {
      height: min(690px, calc(100vh - 210px));
      min-height: 480px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 19px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 38px rgba(3, 6, 12, 0.045);
    }

    .chat-head {
      min-height: 88px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .support-avatar {
      width: 49px;
      height: 49px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 1px solid #eeeeee;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.04);
    }

    .support-avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 3px;
      border-radius: 50%;
    }

    .support-details {
      flex: 1;
      min-width: 0;
    }

    .support-details h2 {
      margin: 0 0 3px;
      color: var(--dark);
      font-size: 15px;
      font-weight: 800;
    }

    .support-status {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #858c97;
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #22b573;
      border-radius: 50%;
    }

    .chat-label {
      padding: 7px 11px;
      color: var(--orange-dark);
      background: #fff3e9;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .messages-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 25px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background:
        radial-gradient(circle at 1px 1px, rgba(3, 6, 12, 0.025) 1px, transparent 0);
      background-size: 20px 20px;
      background-color: #fcfcfd;
      scroll-behavior: smooth;
    }

    .date-divider {
      display: flex;
      justify-content: center;
      margin: 2px 0 8px;
    }

    .date-divider span {
      padding: 6px 12px;
      color: #939aa5;
      background: #f0f1f4;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .message-row {
      width: 100%;
      display: flex;
      align-items: flex-end;
      gap: 9px;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .mini-avatar {
      width: 29px;
      height: 29px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .mini-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 2px;
    }

    .message-content {
      display: flex;
      flex-direction: column;
      max-width: min(72%, 490px);
    }

    .mine .message-content {
      align-items: flex-end;
    }

    .theirs .message-content {
      align-items: flex-start;
    }

    .message-sender {
      color: #7e8692;
      font-size: 11px;
      font-weight: 700;
      margin: 0 0 6px 4px;
    }

    .message-bubble {
      padding: 12px 15px;
      border-radius: 15px;
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .mine .message-bubble {
      color: #fff;
      background: var(--orange);
      border-bottom-right-radius: 5px;
    }

    .theirs .message-bubble {
      color: #303640;
      background: #fff;
      border: 1px solid #eceef2;
      border-bottom-left-radius: 5px;
    }

    .message-bubble.unsent {
      color: #9298a2;
      background: #f1f2f5;
      border: 1px solid #e7e9ed;
      font-style: italic;
      box-shadow: none;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      padding: 0 3px;
      color: #9ba1aa;
      font-size: 10px;
    }

    .unsent-label {
      color: #a0a5ae;
      font-weight: 700;
    }

    .message-action {
      border: 0;
      background: transparent;
      padding: 0;
      color: #a3a8b1;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.2s;
    }

    .message-action:hover {
      color: #d93045;
    }

    .empty-state {
      flex: 1;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .empty-icon {
      width: 61px;
      height: 61px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff0e5;
      color: var(--orange);
      margin-bottom: 17px;
    }

    .empty-icon svg {
      width: 28px;
      height: 28px;
    }

    .empty-state h3 {
      margin: 0 0 7px;
      color: var(--dark);
      font-size: 16px;
      font-weight: 800;
    }

    .empty-state p {
      max-width: 310px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .chat-compose {
      padding: 18px 22px 20px;
      border-top: 1px solid var(--border);
      background: #fff;
    }

    .compose-box {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      padding: 8px 9px 8px 17px;
      border: 1px solid #e4e6eb;
      border-radius: 15px;
      background: #fafbfc;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .compose-box:focus-within {
      border-color: #ffb27b;
      box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.07);
    }

    .compose-box input {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 13px;
    }

    .compose-box input::placeholder {
      color: #a3a9b2;
    }

    .send-btn {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: var(--orange);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .send-btn:hover {
      background: var(--orange-dark);
      transform: translateY(-1px);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .send-btn svg {
      width: 19px;
      height: 19px;
    }

    .compose-hint {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 10px 3px 0;
      color: #a0a6af;
      font-size: 10px;
    }

    .compose-hint strong {
      color: #858c96;
      font-weight: 700;
    }

    .modal-content {
      border: 0;
      border-radius: 18px;
      box-shadow: 0 20px 70px rgba(3, 6, 12, 0.2);
    }

    .modal-header {
      padding: 22px 24px 12px;
      border-bottom: 0;
    }

    .modal-header .modal-title {
      color: var(--dark);
      font-size: 18px;
      font-weight: 800;
    }

    .modal-body {
      padding: 4px 24px 22px;
      color: #737b87;
      font-size: 13px;
      line-height: 1.6;
    }

    .modal-footer {
      padding: 0 24px 22px;
      border-top: 0;
      gap: 8px;
    }

    .btn-cancel {
      padding: 10px 17px;
      border: 1px solid #e2e5e9;
      border-radius: 10px;
      background: #fff;
      color: #555d69;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-unsend {
      padding: 10px 17px;
      border: 0;
      border-radius: 10px;
      background: #d93045;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-unsend:hover {
      background: #bd2437;
      color: #fff;
    }

    @media (max-width: 640px) {
      .topbar {
        height: 67px;
        padding: 0 17px;
      }

      .brand img {
        width: 37px;
        height: 37px;
      }

      .brand-name {
        font-size: 15px;
      }

      .back-link {
        font-size: 12px;
      }

      .page-container {
        width: calc(100% - 20px);
        margin: 19px auto;
      }

      .page-heading {
        margin: 0 5px 15px;
      }

      .page-heading h1 {
        font-size: 23px;
      }

      .page-heading p {
        font-size: 12px;
      }

      .chat-card {
        height: calc(100dvh - 170px);
        min-height: 400px;
        border-radius: 15px;
      }

      .chat-head {
        min-height: 76px;
        padding: 13px 15px;
        gap: 10px;
      }

      .support-avatar {
        width: 43px;
        height: 43px;
      }

      .chat-label {
        padding: 6px 8px;
        font-size: 9px;
      }

      .messages-area {
        padding: 19px 12px;
        gap: 15px;
      }

      .message-content {
        max-width: 83%;
      }

      .message-bubble {
        padding: 10px 12px;
        font-size: 12px;
      }

      .chat-compose {
        padding: 12px;
      }

      .compose-box {
        padding-left: 12px;
        gap: 8px;
      }

      .compose-hint {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a href="customer_dashboard.html" class="brand">
      <img src="../images/mos_logo.png" alt="Maryanne's Online Shop Logo">
      <div class="brand-name">M.O.S <span>ONLINE SHOP</span></div>
    </a>

    <a href="customer_dashboard.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m15 18-6-6 6-6"></path>
        <path d="M9 12h12"></path>
      </svg>
      Back to Dashboard
    </a>
  </header>

  <main class="page-container">
    <div class="page-heading">
      <h1>Messages</h1>
      <p>Have a question? Send a message to our support team.</p>
    </div>

    <section class="chat-card" aria-label="Messages with M.O.S Support">
      <div class="chat-head">
        <div class="support-avatar">
          <img src="../images/mos_logo.png" alt="M.O.S Support">
        </div>

        <div class="support-details">
          <h2>M.O.S Support</h2>
          <div class="support-status">
            <span class="status-dot"></span>
            Customer Support
          </div>
        </div>

        <span class="chat-label">SUPPORT</span>
      </div>

      <div class="messages-area" id="messagesArea" aria-live="polite"></div>

      <form class="chat-compose" id="messageForm">
        <div class="compose-box">
          <input
            type="text"
            id="messageInput"
            placeholder="Write your message..."
            autocomplete="off"
            maxlength="2000"
            aria-label="Write your message"
          >

          <button class="send-btn" type="submit" id="sendBtn" aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m22 2-7 20-4-9-9-4Z"></path>
              <path d="M22 2 11 13"></path>
            </svg>
          </button>
        </div>

        <div class="compose-hint">
          <span>Press <strong>Enter</strong> to send</span>
          <span>Messages are saved on this device</span>
        </div>
      </form>
    </section>
  </main>

  <div class="modal fade" id="unsendModal" tabindex="-1" aria-labelledby="unsendModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="unsendModalTitle">Unsend this message?</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          This message will be replaced with “You unsent a message” in the conversation.
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn-unsend" id="confirmUnsendBtn">Unsend</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js"></script>

  <script>
    const STORAGE_KEY = "valobloxMessages";
    const USER_KEY = "valobloxUser";

    const messagesArea = document.getElementById("messagesArea");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const confirmUnsendBtn = document.getElementById("confirmUnsendBtn");

    const unsendModalElement = document.getElementById("unsendModal");
    const unsendModal = bootstrap.Modal.getOrCreateInstance(unsendModalElement);

    let messageToUnsend = null;

    function getCurrentUser() {
      try {
        const savedUser = localStorage.getItem(USER_KEY);
        return savedUser ? JSON.parse(savedUser) : {};
      } catch (error) {
        return {};
      }
    }

    function getCustomerId() {
      const user = getCurrentUser();

      return String(
        user.userid ||
        user.userId ||
        user.id ||
        user.auth_id ||
        user.email ||
        user.username ||
        "customer-demo"
      );
    }

    function getCustomerName() {
      const user = getCurrentUser();

      return (
        user.fullname ||
        user.fullName ||
        user.name ||
        user.username ||
        "Customer"
      );
    }

    function getMessages() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(stored) ? stored : [];
      } catch (error) {
        return [];
      }
    }

    function saveMessages(messages) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (character) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return entities[character];
      });
    }

    function formatTime(value) {
      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return date.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function getMessageOwner(message) {
      return String(
        message.customerId ||
        message.userId ||
        message.userid ||
        message.senderId ||
        ""
      );
    }

    function isCustomerMessage(message) {
      const sender = String(
        message.senderRole ||
        message.role ||
        message.sender ||
        ""
      ).toLowerCase().trim();

      if (["admin", "support", "staff"].includes(sender)) {
        return false;
      }

      if (["customer", "user", "mine"].includes(sender)) {
        return true;
      }

      const owner = getMessageOwner(message);

      return Boolean(owner) && owner === getCustomerId();
    }

    function isMessageForCurrentCustomer(message) {
      const owner = getMessageOwner(message);

      return !owner || owner === getCustomerId();
    }

    function getMessageText(message) {
      if (message.unsent || message.deleted) {
        if (isCustomerMessage(message)) {
          return "You unsent a message";
        }

        return "M.O.S Support unsent a message";
      }

      return message.text ?? message.message ?? message.content ?? "";
    }

    function getMessageDateKey(value) {
      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("-");
    }

    function formatDateLabel(value) {
      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "";
      }

      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);

      if (getMessageDateKey(date) === getMessageDateKey(today)) {
        return "Today";
      }

      if (getMessageDateKey(date) === getMessageDateKey(yesterday)) {
        return "Yesterday";
      }

      return date.toLocaleDateString([], {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    }

    function makeDateDivider(label) {
      const divider = document.createElement("div");
      divider.className = "date-divider";

      const span = document.createElement("span");
      span.textContent = label;

      divider.appendChild(span);
      return divider;
    }

    function makeSupportAvatar() {
      const avatar = document.createElement("div");
      avatar.className = "mini-avatar";

      const image = document.createElement("img");
      image.src = "../images/mos_logo.png";
      image.alt = "M.O.S Support";

      avatar.appendChild(image);
      return avatar;
    }

    function render() {
      const allMessages = getMessages();

      const customerMessages = allMessages
        .filter(isMessageForCurrentCustomer)
        .filter(function (message) {
          return Boolean(
            message.customerId ||
            message.userId ||
            message.userid ||
            message.senderId ||
            isCustomerMessage(message)
          );
        })
        .sort(function (a, b) {
          return new Date(a.createdAt || a.timestamp || 0) -
            new Date(b.createdAt || b.timestamp || 0);
        });

      messagesArea.replaceChildren();

      if (customerMessages.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";

        empty.innerHTML = `
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"></path>
            </svg>
          </div>
          <h3>Start a conversation</h3>
          <p>Send us a message if you have questions about your application, installments, or account.</p>
        `;

        messagesArea.appendChild(empty);
        return;
      }

      let previousDateKey = "";

      customerMessages.forEach(function (message) {
        const createdAt = message.createdAt || message.timestamp || new Date().toISOString();
        const dateKey = getMessageDateKey(createdAt);

        if (dateKey && dateKey !== previousDateKey) {
          messagesArea.appendChild(makeDateDivider(formatDateLabel(createdAt)));
          previousDateKey = dateKey;
        }

        const mine = isCustomerMessage(message);
        const unsent = Boolean(message.unsent || message.deleted);

        const row = document.createElement("div");
        row.className = "message-row " + (mine ? "mine" : "theirs");

        if (!mine) {
          row.appendChild(makeSupportAvatar());
        }

        const content = document.createElement("div");
        content.className = "message-content";

        if (!mine) {
          const sender = document.createElement("div");
          sender.className = "message-sender";
          sender.textContent = message.senderName || "M.O.S Support";
          content.appendChild(sender);
        }

        const bubble = document.createElement("div");
        bubble.className = "message-bubble" + (unsent ? " unsent" : "");
        bubble.textContent = getMessageText(message);
        content.appendChild(bubble);

        const meta = document.createElement("div");
        meta.className = "message-meta";

        const time = document.createElement("span");
        time.textContent = formatTime(createdAt);
        meta.appendChild(time);

        if (mine && unsent) {
          const unsentLabel = document.createElement("span");
          unsentLabel.className = "unsent-label";
          unsentLabel.textContent = "Unsent";
          meta.appendChild(unsentLabel);
        } else if (mine) {
          const action = document.createElement("button");
          action.type = "button";
          action.className = "message-action";
          action.textContent = "Unsend";
          action.setAttribute("aria-label", "Unsend this message");

          action.addEventListener("click", function () {
            messageToUnsend = message.id;
            unsendModal.show();
          });

          meta.appendChild(action);
        }

        content.appendChild(meta);
        row.appendChild(content);
        messagesArea.appendChild(row);

        if (!mine && !message.readByCustomer) {
          message.readByCustomer = true;
        }
      });

      saveMessages(allMessages);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    messageForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const text = messageInput.value.trim();

      if (!text) {
        messageInput.focus();
        return;
      }

      const customerId = getCustomerId();

      const messages = getMessages();

      messages.push({
        id: "msg-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8),
        customerId: customerId,
        userId: customerId,
        senderId: customerId,
        sender: "customer",
        senderRole: "customer",
        senderName: getCustomerName(),
        text: text,
        createdAt: new Date().toISOString(),
        unsent: false,
        readByCustomer: true
      });

      saveMessages(messages);
      messageInput.value = "";
      render();
      messageInput.focus();
    });

    messageInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        messageForm.requestSubmit();
      }
    });

    confirmUnsendBtn.addEventListener("click", function () {
      if (!messageToUnsend) {
        unsendModal.hide();
        return;
      }

      const messages = getMessages();

      const message = messages.find(function (item) {
        return String(item.id) === String(messageToUnsend);
      });

      if (message && isCustomerMessage(message)) {
        message.text = "";
        message.message = "";
        message.content = "";
        message.unsent = true;
        message.unsentAt = new Date().toISOString();

        saveMessages(messages);
      }

      messageToUnsend = null;
      unsendModal.hide();
      render();
    });

    unsendModalElement.addEventListener("hidden.bs.modal", function () {
      messageToUnsend = null;
    });

    render();
  </script>
</body>
</html>
